name: CI

# CI runs on main only, and only when files the plugin runs from change (skills, examples,
# hooks). Branches: main (plugin source), develop, release (what users install:
# .claude-plugin, .codex-plugin, hooks, skills, examples; no tests).
on:
  push:
    branches: [main]
    paths: ['skills/**', 'examples/**', 'hooks/**']
  pull_request:
    branches: [main]
    paths: ['skills/**', 'examples/**', 'hooks/**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
